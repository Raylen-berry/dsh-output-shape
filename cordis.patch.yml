# ============================================================================
# dsh-output-shape — DSH bundle patch
# ============================================================================
# 宿主行：随 bundle 层栈插入 Web profile。本包做两件事：
#   ① 把 skills/i-have-adhd 注册进 ctx.skills 全局层（默认开）；
#   ② 可选：把同一份规则常驻注入 system prompt（默认**关**）。
#
# 安装（在 DSH 里让助手执行，或关闭 DSH 后在终端执行）：
#   dsh plugin --profile web add link:D:/DeepSeek/dsh-plugins/dsh-output-shape
# 装完**重启一次桌面端**（宿主行 + 新技能都要重新扫描）。
#
# 默认 alwaysOn: true —— 本插件就是这套形状规则的**真源**。会话守则里那节 R4 已于
#   2026-09-16 摘出（dsh-cache-control/session-gate.md 现在只留一句归属声明），
#   所以不存在两处同时注入。若你在别处又抄了一份常驻副本，关掉这里的开关或删掉那份。
#
# 想临时关掉常驻注入而不动仓库文件：设置页「输出形状」的开关，或逃生开关
# （技能注册不受影响）：
#   $env:DSH_OUTPUT_SHAPE_DISABLE = '1'
#
# 在自己的 $DSH_HOME/profiles/web/cordis.patch.yml 里按 id 覆盖 config
# （config 是整块替换：覆盖时把其它键一起写上）：
#   - id: output-shape
#     config:
#       registerSkills: true
#       alwaysOn: true
#       maxBytes: 16384
# ============================================================================

- insert:
    - id: output-shape
      name: dsh-output-shape
      config:
        # 是否把本包 skills/ 注册进全局技能目录。
        registerSkills: true
        # 是否常驻注入 system prompt。默认 true：本插件是这套规则的真源，
        # 会话守则里的 R4 已摘出，不会重复注入。关掉＝退回"只在需要时调用技能"。
        alwaysOn: true
        # 常驻注入文本的字节上限（这段文本每请求重复计费）。
        maxBytes: 16384
